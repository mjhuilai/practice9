<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用统计 · 迷你版校园信息中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="offline-tip">⚠ 当前网络已断开，部分数据可能无法加载</div>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: var(--campus-primary);">
    <div class="container">
      <a class="navbar-brand" href="index.html">🏫 校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">使用统计图表</h1>

    <!-- 加载失败 / 空数据提示（默认隐藏） -->
    <p id="status" class="alert" style="display: none;"></p>

    <!-- 各自习室使用量柱状图 -->
    <section class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">各自习室使用量</h2>
          <button id="reload-btn" class="btn btn-sm btn-outline-primary" type="button">重新加载数据</button>
        </div>
        <div id="usage-chart" class="chart-box"></div>
        <p id="data-source" class="small text-muted mt-2 mb-0">数据来源：加载中…</p>
      </div>
    </section>
  </main>

  <footer class="py-3 mt-4">
    <div class="container d-flex flex-wrap gap-2 justify-content-between align-items-center">
      <span>数据来源：课程演示数据（data/data.json）</span>
      <span id="console-badge" class="badge bg-success">Console 无报错</span>
    </div>
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
