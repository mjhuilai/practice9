<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询 · 迷你版校园信息中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="offline-tip">⚠ 当前网络已断开，部分数据可能无法加载</div>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: var(--campus-primary);">
    <div class="container">
      <a class="navbar-brand" href="index.html">🏫 校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">自习室查询</h1>

    <!-- 筛选区：楼层 / 开放状态，change 即生效 -->
    <div class="filter-bar row g-3 align-items-end mb-3">
      <div class="col-auto">
        <label for="floor-filter" class="form-label">楼层</label>
        <select id="floor-filter" class="form-select">
          <option value="all">全部楼层</option>
          <option value="1">1 楼</option>
          <option value="2">2 楼</option>
          <option value="3">3 楼</option>
        </select>
      </div>
      <div class="col-auto">
        <label for="status-filter" class="form-label">开放状态</label>
        <select id="status-filter" class="form-select">
          <option value="all">全部状态</option>
          <option value="open">开放中</option>
          <option value="closed">已关闭</option>
        </select>
      </div>
      <div class="col-auto ms-auto">
        <span id="result-count" class="text-muted"></span>
      </div>
    </div>

    <!-- 自习室列表（由 rooms.js 渲染） -->
    <div id="room-list" class="row g-3"></div>
  </main>

  <footer class="py-3 mt-4">
    <div class="container d-flex flex-wrap gap-2 justify-content-between align-items-center">
      <span>数据来源：课程演示数据（data/data.json）</span>
      <span id="console-badge" class="badge bg-success">Console 无报错</span>
    </div>
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/rooms.js"></script>
</body>
</html>
