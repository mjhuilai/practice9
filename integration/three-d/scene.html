<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览 · 迷你版校园信息中心</title>
  <!-- 复用课堂七：A-Frame 三维场景 -->
  <script src="../libs/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }

    /* 返回首页按钮：从三维场景返回首页 */
    #back-home {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9999;
      display: inline-block;
      padding: 0.5rem 1rem;
      background: rgba(27, 110, 194, 0.92);
      color: #fff;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    #scene-title {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9999;
      max-width: 260px;
      padding: 0.6rem 0.9rem;
      background: rgba(38, 50, 56, 0.82);
      color: #fff;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- 返回首页入口 -->
  <a id="back-home" href="../index.html">← 返回首页</a>
  <div id="scene-title">
    校园三维导览<br>
    拖动旋转视角 · 滚轮缩放<br>
    地标：教学楼 / 图书馆 / 国旗广场
  </div>

  <a-scene>
    <!-- 环境：天空与草地 -->
    <a-sky color="#aee3f7"></a-sky>
    <a-plane
      position="0 0 -4" rotation="-90 0 0"
      width="24" height="24" color="#7cb342">
    </a-plane>

    <!-- 地标1：教学楼（方盒 + 红色屋顶） -->
    <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
    <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>

    <!-- 地标2：图书馆（方盒 + 蓝色屋顶） -->
    <a-box position="-4.5 1 -6.5" width="3" height="2" depth="2" color="#f5f5f5"></a-box>
    <a-box position="-4.5 2.2 -6.5" width="3.3" height="0.35" depth="2.3" color="#1565c0"></a-box>

    <!-- 地标3：旗杆与旗帜（旗帜带飘扬动画） -->
    <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
    <a-box
      position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
      animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true">
    </a-box>

    <!-- 路灯：杆 + 发光球（点光源，带呼吸动画） -->
    <a-cylinder position="-2.4 1.2 -3.2" radius="0.06" height="2.4" color="#616161"></a-cylinder>
    <a-sphere position="-2.4 2.5 -3.2" radius="0.18" color="#fff59d"
              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
    </a-sphere>
    <a-light type="point" position="-2.4 2.6 -3.2" color="#fff59d" intensity="0.6"></a-light>

    <!-- 环境光 -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>

    <!-- 相机初始位：稍远处平视校园 -->
    <a-camera position="0 1.8 2"></a-camera>
  </a-scene>
</body>
</html>
